<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- window.ps1 finds this window by title to close it if window.close() is
     refused, so keep the title in step with server.js's WINDOW_TITLE. -->
<title>BurnMeter Party</title>
<link rel="icon" href="/icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 34%, #241b33 0%, #0b0910 72%);
  color:#fff; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none; cursor:default;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px}

h1{
  font-size:clamp(24px,6.4vw,54px); font-weight:800; letter-spacing:-.02em; line-height:1;
  background:linear-gradient(92deg,#ffd166,#c98bff 45%,#8ecae6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;
}
.sub{font-size:clamp(12px,2.3vw,16px);color:#c9c8bd;animation:pop .55s .1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}

#dancer{width:clamp(150px,36vh,250px);height:auto;margin:4px 0 0;overflow:visible}

/* Each part swings on its own pivot; the whole figure bounces on the beat.
   0.48s a cycle is 125bpm, which is about right for a celebration. */
.beat   {animation:beat .48s ease-in-out infinite}
.hips   {animation:hips .96s ease-in-out infinite; transform-origin:120px 165px}
.armL   {animation:armL .96s ease-in-out infinite; transform-origin:99px 98px}
.armR   {animation:armR .96s ease-in-out infinite; transform-origin:141px 98px}
.legL   {animation:legL .96s ease-in-out infinite; transform-origin:112px 196px}
.legR   {animation:legR .96s ease-in-out infinite; transform-origin:128px 196px}
.head   {animation:head .96s ease-in-out infinite; transform-origin:120px 74px}
.tail   {animation:tail .96s ease-in-out infinite; transform-origin:136px 24px}
.tailTip{animation:tailTip .96s ease-in-out .08s infinite; transform-origin:168px 60px}
.lockL  {animation:lockL .96s ease-in-out infinite; transform-origin:97px 40px}
.lockR  {animation:lockR .96s ease-in-out infinite; transform-origin:143px 40px}
.skirt  {animation:skirt .96s ease-in-out infinite; transform-origin:120px 170px}
.blink  {animation:blink 4.6s infinite}
.note   {animation:note 2.1s linear infinite; opacity:0}
.note2  {animation:note 2.1s .95s linear infinite; opacity:0}

@keyframes beat    {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hips    {0%,100%{transform:rotate(-4deg) translateX(-2px)}50%{transform:rotate(4deg) translateX(2px)}}
@keyframes head    {0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
@keyframes armL    {0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes armR    {0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}
@keyframes legL    {0%,100%{transform:rotate(3deg)}50%{transform:rotate(-4deg)}}
@keyframes legR    {0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes tail    {0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
@keyframes tailTip {0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes lockL   {0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes lockR   {0%,100%{transform:rotate(4deg)}50%{transform:rotate(-5deg)}}
@keyframes skirt   {0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink   {0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.08)}}
@keyframes note    {0%{opacity:0;transform:translate(0,0) rotate(0)}
                    15%{opacity:1}
                    100%{opacity:0;transform:translate(24px,-56px) rotate(22deg)}}

.foot{position:fixed;bottom:9px;left:0;right:0;z-index:3;text-align:center;font-size:11.5px;color:#6f6d66}
.foot b{color:#a9a7a0;font-variant-numeric:tabular-nums}
.foot button{
  background:none;border:1px solid rgba(255,255,255,.18);color:#a9a7a0;font:inherit;font-size:11px;
  padding:3px 10px;border-radius:6px;cursor:pointer;margin-left:8px;
}
.foot button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="stage">
  <h1 id="title">CAPACITY IS BACK</h1>
  <div class="sub" id="sub">go go go</div>

  <!-- Original artwork: drawn here, not borrowed from anywhere. -->
  <svg id="dancer" viewBox="0 0 240 316" role="img" aria-label="a figure dancing">
    <defs>
      <linearGradient id="hairDark" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#3a2b45"/><stop offset="0.55" stop-color="#221a2c"/>
        <stop offset="1" stop-color="#17111f"/>
      </linearGradient>
      <linearGradient id="hairPink" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff8fd0"/><stop offset="1" stop-color="#d13c8e"/>
      </linearGradient>
      <linearGradient id="cloth" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#2e2536"/><stop offset="0.5" stop-color="#191220"/>
        <stop offset="1" stop-color="#241a2e"/>
      </linearGradient>
      <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#ffe2cd"/><stop offset="1" stop-color="#f0c4a6"/>
      </linearGradient>
      <radialGradient id="iris" cx="50%" cy="35%" r="70%">
        <stop offset="0" stop-color="#c9a4ff"/><stop offset="0.6" stop-color="#7b4fd0"/>
        <stop offset="1" stop-color="#3d2168"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ff8fd0" stop-opacity=".26"/>
        <stop offset="1" stop-color="#ff8fd0" stop-opacity="0"/>
      </radialGradient>
      <!-- one blossom, reused as embroidery -->
      <g id="sakura">
        <g fill="#ff7ab8">
          <ellipse cx="0" cy="-3.1" rx="1.7" ry="2.7"/>
          <ellipse cx="2.9" cy="-0.9" rx="1.7" ry="2.7" transform="rotate(72)"/>
          <ellipse cx="1.8" cy="2.5" rx="1.7" ry="2.7" transform="rotate(144)"/>
          <ellipse cx="-1.8" cy="2.5" rx="1.7" ry="2.7" transform="rotate(216)"/>
          <ellipse cx="-2.9" cy="-0.9" rx="1.7" ry="2.7" transform="rotate(288)"/>
        </g>
        <circle r="0.9" fill="#ffd7ec"/>
      </g>
    </defs>

    <ellipse cx="120" cy="302" rx="42" ry="7" fill="#000" opacity=".4"/>
    <circle cx="120" cy="150" r="118" fill="url(#glow)"/>

    <g class="beat">

      <!-- ponytail, behind everything -->
      <g class="tail">
        <path d="M134 20 q34 6 44 34 q8 26 -6 50 q-6 10 -14 16 q10 -26 4 -50 q-6 -26 -32 -38 z" fill="url(#hairDark)"/>
        <path d="M140 26 q26 10 32 32 q5 20 -3 38 q3 -22 -6 -38 q-9 -19 -27 -26 z" fill="url(#hairPink)" opacity=".85"/>
        <g class="tailTip">
          <path d="M170 96 q10 30 -2 60 q-6 14 -16 22 q12 -30 8 -54 q-2 -16 -8 -26 z" fill="url(#hairDark)"/>
          <path d="M168 104 q7 26 -1 48 q-3 10 -9 17 q7 -24 5 -43 q-1 -13 -5 -20 z" fill="url(#hairPink)" opacity=".7"/>
        </g>
      </g>

      <!-- legs -->
      <g class="legL">
        <path d="M112 192 q-4 40 -2 76 q1 14 0 24" stroke="url(#skin)" stroke-width="15" stroke-linecap="round" fill="none"/>
        <path d="M104 292 q7 -4 14 0 l1 9 h-16 z" fill="#1d1526"/>
      </g>
      <g class="legR">
        <path d="M128 192 q4 40 2 76 q-1 14 0 24" stroke="url(#skin)" stroke-width="15" stroke-linecap="round" fill="none"/>
        <path d="M122 292 q7 -4 14 0 l1 9 h-16 z" fill="#1d1526"/>
      </g>

      <g class="hips">
        <!-- pleated skirt -->
        <g class="skirt">
          <path d="M96 166 h48 l9 32 h-66 z" fill="url(#cloth)"/>
          <g stroke="#3a2c46" stroke-width="1.4">
            <path d="M105 168 l-3 30"/><path d="M114 168 l-1 30"/>
            <path d="M126 168 l1 30"/><path d="M135 168 l3 30"/>
          </g>
          <path d="M87 198 h66 l1 4 h-68 z" fill="#120d18"/>
          <!-- tassel -->
          <path d="M120 172 v22" stroke="#c9a227" stroke-width="1.6"/>
          <circle cx="120" cy="196" r="3" fill="#e0b736"/>
          <path d="M117 199 q3 12 6 0 z" fill="#e0559e"/>
          <path d="M118 199 v11 M120 199 v13 M122 199 v11" stroke="#e0559e" stroke-width="1.2"/>
        </g>
        <!-- belt -->
        <path d="M95 156 h50 v11 h-50 z" fill="#2a2130"/>
        <path d="M112 155 h16 v13 h-16 z" fill="#c9a227"/>
        <path d="M115 158 h10 v7 h-10 z" fill="#1d1526"/>
      </g>

      <!-- arms -->
      <g class="armL">
        <path d="M99 98 q-12 24 -8 44" stroke="url(#cloth)" stroke-width="13" stroke-linecap="round" fill="none"/>
        <use href="#sakura" x="93" y="118" transform="scale(.9) translate(10 12)"/>
        <path d="M91 140 q-2 10 2 17" stroke="url(#cloth)" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="94" cy="160" r="6.5" fill="url(#skin)"/>
      </g>
      <g class="armR">
        <!-- raised, hand near the cheek -->
        <path d="M141 98 q16 -12 18 -30" stroke="url(#cloth)" stroke-width="13" stroke-linecap="round" fill="none"/>
        <use href="#sakura" x="0" y="0" transform="translate(152 82)"/>
        <path d="M159 68 q-4 -12 -12 -18" stroke="url(#cloth)" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="145" cy="48" r="7" fill="url(#skin)"/>
        <path d="M141 44 q4 -7 9 -3" stroke="#e8b79a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>

      <!-- torso: fitted high-neck top with blossom embroidery -->
      <path d="M102 90 q18 -5 36 0 l7 66 h-50 z" fill="url(#cloth)"/>
      <path d="M102 90 q18 -5 36 0 l1 8 q-19 -5 -38 0 z" fill="#332839"/>
      <path d="M120 96 v58" stroke="#3a2c46" stroke-width="1.2"/>
      <g opacity=".95">
        <use href="#sakura" transform="translate(108 112)"/>
        <use href="#sakura" transform="translate(133 124) scale(.85)"/>
        <use href="#sakura" transform="translate(112 140) scale(.8)"/>
        <use href="#sakura" transform="translate(129 100) scale(.7)"/>
      </g>
      <!-- collar -->
      <path d="M111 86 h18 v7 q-9 3 -18 0 z" fill="#241a2e"/>
      <path d="M111 86 h18 v2 h-18 z" fill="#e0559e"/>

      <!-- neck -->
      <path d="M114 74 h12 v13 q-6 4 -12 0 z" fill="#f0c4a6"/>

      <g class="head">
        <!-- face -->
        <ellipse cx="120" cy="48" rx="24" ry="27" fill="url(#skin)"/>
        <!-- side locks -->
        <g class="lockL"><path d="M97 40 q-7 26 -3 44 q6 -12 10 -18 q-6 -12 -7 -26 z" fill="url(#hairDark)"/>
          <path d="M99 46 q-4 20 -1 32 q3 -12 6 -17 q-4 -8 -5 -15 z" fill="url(#hairPink)" opacity=".8"/></g>
        <g class="lockR"><path d="M143 40 q7 26 3 44 q-6 -12 -10 -18 q6 -12 7 -26 z" fill="url(#hairDark)"/>
          <path d="M141 46 q4 20 1 32 q-3 -12 -6 -17 q4 -8 5 -15 z" fill="url(#hairPink)" opacity=".8"/></g>

        <!-- bangs: spiky, parted -->
        <path d="M95 44 q0 -30 25 -30 q25 0 25 30 q-3 -16 -10 -21
                 l-4 15 l-5 -17 l-6 18 l-5 -16 l-6 14 l-5 -13 q-7 6 -9 20 z" fill="url(#hairDark)"/>
        <path d="M112 15 q14 -3 22 10 q-4 12 -8 14 l-3 -13 l-5 15 l-6 -16 z" fill="url(#hairPink)" opacity=".55"/>
        <!-- scrunchie -->
        <ellipse cx="136" cy="22" rx="8" ry="6" fill="#e0559e"/>
        <ellipse cx="136" cy="22" rx="4.5" ry="3" fill="#ff9ed4"/>

        <!-- brows -->
        <path d="M105 39 q6 -3 11 -1" stroke="#3b2b48" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M124 38 q5 -2 11 1" stroke="#3b2b48" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- left eye, open -->
        <g class="blink" style="transform-origin:110px 52px">
          <ellipse cx="110" cy="52" rx="6.4" ry="8" fill="#fff"/>
          <ellipse cx="110" cy="53" rx="5.2" ry="7" fill="url(#iris)"/>
          <ellipse cx="110" cy="53.5" rx="2.4" ry="3.6" fill="#180f22"/>
          <circle cx="112" cy="49" r="2.3" fill="#fff"/>
          <circle cx="108" cy="56" r="1.2" fill="#fff" opacity=".75"/>
          <path d="M103 46 q7 -4 14 1" stroke="#241629" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <!-- right eye, winking -->
        <path d="M124 53 q6 -6 12 0" stroke="#241629" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M135 49 l4 -3 M136 53 l5 0" stroke="#241629" stroke-width="1.8" stroke-linecap="round"/>

        <!-- blush + smile -->
        <ellipse cx="101" cy="60" rx="5.5" ry="3" fill="#ff7ab8" opacity=".45"/>
        <ellipse cx="139" cy="60" rx="5.5" ry="3" fill="#ff7ab8" opacity=".45"/>
        <path d="M114 64 q6 7 12 0 q-6 3 -12 0 z" fill="#8e2b52"/>
        <path d="M114 64 q6 7 12 0" stroke="#8e2b52" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M116 65.5 q4 2 8 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- earring -->
        <circle cx="97" cy="56" r="1.8" fill="#e0b736"/>
      </g>

      <g class="note"  fill="#ffd166"><circle cx="186" cy="140" r="4"/><rect x="189" y="124" width="2.2" height="17"/></g>
      <g class="note2" fill="#8ecae6"><circle cx="54" cy="150" r="3.4"/><rect x="56.6" y="136" width="2" height="15"/></g>
    </g>
  </svg>
</div>

<div class="foot">
  closing in <b id="count">15</b>s
  <button id="stay">stay open</button>
  <button id="bye">close now</button>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);

$('#title').textContent = (qs.get('title') || 'CAPACITY IS BACK').toUpperCase().slice(0, 40);
$('#sub').innerHTML = (qs.get('sub') || 'go go go')
  .slice(0, 120).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* -------------------------------------------------------------- confetti -- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let W = 0, H = 0; const dpr = Math.min(2, devicePixelRatio || 1);
function fit() {
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();

const COLOURS = ['#ffd166', '#ff8fab', '#8ecae6', '#25a83b', '#e2673a', '#c98bff', '#ffffff'];
const bits = [];
/** A cannon from a point, or a curtain falling from above. */
function burst(n, ox, oy, spread) {
  for (let i = 0; i < n; i++) {
    const cannon = ox != null;
    const a = cannon ? (-Math.PI / 2) + (Math.random() - .5) * (spread || 1.5) : 0;
    const sp = cannon ? 6 + Math.random() * 11 : 0;
    bits.push({
      x: cannon ? ox : Math.random() * W,
      y: cannon ? oy : -20 - Math.random() * H * .5,
      vx: cannon ? Math.cos(a) * sp : (Math.random() - .5) * 2.4,
      vy: cannon ? Math.sin(a) * sp : 1 + Math.random() * 3,
      w: 5 + Math.random() * 8, h: 8 + Math.random() * 11,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
      col: COLOURS[(Math.random() * COLOURS.length) | 0],
      petal: Math.random() < 0.28,          // a third of it is blossom
      wob: Math.random() * Math.PI * 2
    });
  }
  if (bits.length > 1200) bits.splice(0, bits.length - 1200);
}
function frame() {
  cx.clearRect(0, 0, W, H);
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.vy += 0.17; b.wob += 0.1;
    b.x += b.vx + Math.sin(b.wob) * 0.9;
    b.y += b.vy; b.rot += b.vr; b.vx *= 0.992;
    if (b.y > H + 40) { bits.splice(i, 1); continue; }
    cx.save();
    cx.translate(b.x, b.y); cx.rotate(b.rot);
    if (b.petal) {
      // a sakura petal: notched at the tip, and it flutters edge-on
      cx.fillStyle = b.pink || (b.pink = ['#ff9ed4', '#ff7ab8', '#ffd0e8'][(Math.random() * 3) | 0]);
      cx.beginPath();
      cx.ellipse(0, 0, b.w * 0.55 * Math.abs(Math.cos(b.wob * .7)), b.h * 0.5, 0, 0, Math.PI * 2);
      cx.fill();
    } else {
      cx.fillStyle = b.col;
      cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.wob * .7)));
    }
    cx.restore();
  }
  requestAnimationFrame(frame);
}
frame();

/* ------------------------------------------------------------------ noise -- */
/*
 * A party popper, a paper horn and a kazoo, synthesised - nothing to ship.
 *   pop     white noise through a bandpass, plus a pitch-dropping thump
 *   horn    sawtooth glissando up, the way a paper blowout unrolls
 *   kazoo   sawtooth + vibrato through a narrow bandpass: the buzzy, nasal bit
 * The window is launched with --autoplay-policy=no-user-gesture-required, so
 * it is allowed to make noise without anyone clicking first.
 */
let AC = null;
function audio() {
  if (qs.get('sound') === '0') return null;
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  return AC;
}

function noiseBuffer(ac, secs, shape) {
  const len = Math.max(1, Math.floor(ac.sampleRate * secs));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * shape(i / len);
  return buf;
}

function pop(at = 0, gain = 1) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + at;
  // the crack
  const src = ac.createBufferSource();
  src.buffer = noiseBuffer(ac, 0.16, x => Math.pow(1 - x, 7));
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q = 0.8;
  const g = ac.createGain(); g.gain.value = 0.85 * gain;
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t);
  // the body of the thump
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(440, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.13);
  og.gain.setValueAtTime(0.7 * gain, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(og); og.connect(ac.destination);
  o.start(t); o.stop(t + 0.25);
  // paper scatter
  const s2 = ac.createBufferSource();
  s2.buffer = noiseBuffer(ac, 0.7, x => Math.pow(1 - x, 2.2) * 0.5);
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3800;
  const g2 = ac.createGain(); g2.gain.value = 0.5 * gain;
  s2.connect(hp); hp.connect(g2); g2.connect(ac.destination);
  s2.start(t + 0.02);
}

function horn(at = 0) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q = 1.4;
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(196, t);
  o.frequency.exponentialRampToValueAtTime(587, t + 0.30);
  o.frequency.setValueAtTime(587, t + 0.34);
  o.frequency.exponentialRampToValueAtTime(392, t + 0.62);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.05);
  g.gain.setValueAtTime(0.5, t + 0.40);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.66);
  o.connect(bp); bp.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.7);
}

function kazoo(freq, at, dur) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + at;
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t);
  // vibrato: the wobble that makes it read as a kazoo and not a synth
  const vib = ac.createOscillator(), vg = ac.createGain();
  vib.frequency.value = 5.5; vg.gain.value = freq * 0.022;
  vib.connect(vg); vg.connect(o.frequency);
  // buzz: a touch of noise riding along
  const bz = ac.createBufferSource();
  bz.buffer = noiseBuffer(ac, dur + 0.1, () => 1);
  const bzg = ac.createGain(); bzg.gain.value = 0.05;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = freq * 2.6; bp.Q = 2.4;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.03);
  g.gain.setValueAtTime(0.34, t + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(bp); bz.connect(bzg); bzg.connect(bp); bp.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
  vib.start(t); vib.stop(t + dur + 0.05);
  bz.start(t); bz.stop(t + dur + 0.05);
}

function celebrate() {
  pop(0);
  horn(0.10);
  // a little kazoo fanfare: G G C E G held
  const G4 = 392, C5 = 523.25, E5 = 659.25, G5 = 783.99;
  [[G4, .62, .13], [G4, .78, .13], [C5, .94, .16], [E5, 1.14, .16], [G5, 1.34, .62]]
    .forEach(([f, a, d]) => kazoo(f, a, d));
  pop(1.34, 0.8);
}

/* --------------------------------------------------------------- sequence -- */
burst(140, W / 2, H * 0.72, 1.5);          // cannon from the floor
setTimeout(() => { burst(60, 10, H * 0.5, 1.0); pop(0, .7); }, 900);
setTimeout(() => { burst(60, W - 10, H * 0.5, 1.0); }, 1000);
setTimeout(() => burst(70), 1500);          // curtain from above
const rain = setInterval(() => burst(26), 850);
const pops = setInterval(() => { burst(70, Math.random() * W, H * .8, 1.2); pop(0, .55); }, 4200);
celebrate();

/* ------------------------------------------------------------- auto close -- */
let left = Math.max(3, Math.min(120, Number(qs.get('secs')) || 15));
let staying = false;
$('#count').textContent = left;
const tick = setInterval(() => {
  if (staying) return;
  left--;
  $('#count').textContent = Math.max(0, left);
  if (left <= 0) { clearInterval(tick); clearInterval(rain); clearInterval(pops); bye(); }
}, 1000);

$('#stay').onclick = () => {
  staying = true;
  $('.foot').innerHTML = '<button id="bye2">close</button>';
  $('#bye2').onclick = bye;
};
$('#bye').onclick = bye;

function bye() {
  clearInterval(rain); clearInterval(pops);
  try { window.close(); } catch {}
  // An app window the browser opened may refuse window.close(); ask the
  // server to close it the OS way instead.
  setTimeout(() => {
    fetch('/api/window', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'close', which: 'party' })
    }).catch(() => {});
  }, 400);
}
