<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The OS window title. desktop/window.ps1 finds the window by this exact
     string to pin / resize / move it, so don't change it without updating that. -->
<title>BurnMeter Gauge</title>
<link rel="icon" href="/icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#0d0d0d; color:#fff;
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none; cursor:default;
}
/* Every face is one SVG on a fixed 320x160 viewBox, scaled to fit whatever
   size the window is. That is what lets the gauge survive any window shape. */
#stage{position:absolute;inset:0;cursor:pointer}
#stage svg{width:100%;height:100%;display:block}

#ctl{
  position:absolute;top:3px;right:3px;display:flex;gap:1px;z-index:6;
  background:rgba(18,18,16,.88);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:2px;
  opacity:0;transition:opacity .15s;
}
body:hover #ctl,#ctl:focus-within{opacity:1}
#ctl button{
  background:none;border:none;color:#a9a7a0;font:inherit;font-size:11px;line-height:1;
  padding:4px 6px;border-radius:5px;cursor:pointer;min-width:22px;
}
#ctl button:hover{background:rgba(255,255,255,.15);color:#fff}
#ctl button[aria-pressed="true"]{background:#4a94ee;color:#fff}

#pick{
  position:absolute;inset:0;z-index:8;background:rgba(8,8,8,.94);
  display:none;flex-direction:column;padding:9px;gap:5px;overflow:auto;color:#fff;
}
#pick.open{display:flex}
#pick h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8b8983;font-weight:600}
#pick .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:4px}
#pick button{
  background:#1e1e1c;border:1px solid rgba(255,255,255,.12);color:#c9c8bd;font:inherit;
  font-size:11px;padding:6px 4px;border-radius:6px;cursor:pointer;text-align:center;
}
#pick button:hover{background:#2b2b27;color:#fff}
#pick button[aria-pressed="true"]{background:#4a94ee;border-color:#4a94ee;color:#fff;font-weight:600}
#pick .close{position:absolute;top:6px;right:6px;min-width:0;padding:3px 7px}

#stale{position:absolute;left:0;right:0;bottom:0;height:2px;background:#e04a4a;opacity:0;
       transition:opacity .3s;z-index:7}
#stale.on{opacity:.85}
</style>
</head>
<body>
<div id="stage"></div>

<div id="ctl">
  <button id="bPin"  title="Keep this window on top of everything">&#128204;</button>
  <button id="bDown" title="Smaller">&minus;</button>
  <button id="bUp"   title="Bigger">+</button>
  <button id="bSnap" title="Park it in a screen corner (click again to cycle)">&#11154;</button>
  <button id="bSkin" title="Change the gauge face   [ and ] cycle">&#9673;</button>
  <button id="bOpen" title="Open the full dashboard">&#10530;</button>
</div>

<div id="pick">
  <button class="close" id="pClose">&#10005;</button>
  <h4>Gauge face</h4>
  <div class="grid" id="pSkins"></div>
  <h4>Reading</h4>
  <div class="grid" id="pMetrics"></div>
</div>

<div id="stale" title="No fresh data"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ========================================================== formatting === */
const money = (v, exact) => {
  const n = Math.abs(Number(v) || 0);
  if (n >= 100000) return '$' + (n / 1000).toFixed(0) + 'k';
  if (n >= 10000)  return '$' + (n / 1000).toFixed(1) + 'k';
  if (n >= 1000 && !exact) return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return '$' + n.toFixed(2);
};
const plain = v => {
  const n = Math.abs(Number(v) || 0);
  return n >= 1000 ? n.toFixed(0) : n.toFixed(2);
};
const toks = n => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'k';
  return String(Math.round(n));
};
const dur = ms => {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
};
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* Burn rate is spiky and spans three orders of magnitude, so every dial maps
   it logarithmically: $1/hr still moves the needle, $300/hr pins it. */
const GMAX = 300;
const gf = v => Math.min(1, Math.max(0, Math.log10(1 + Math.max(0, v)) / Math.log10(1 + GMAX)));
const zone = f => f >= .85 ? '#e04a4a' : f >= .65 ? '#e88a4e' : f >= .4 ? '#e0a516' : '#25a83b';

/* ============================================================== geometry = */
const rd = d => d * Math.PI / 180;
const polar = (cx, cy, r, deg) => [cx + r * Math.cos(rd(deg)), cy + r * Math.sin(rd(deg))];
function arcPath(cx, cy, r, d0, d1) {
  const [x0, y0] = polar(cx, cy, r, d0), [x1, y1] = polar(cx, cy, r, d1);
  const large = Math.abs(d1 - d0) > 180 ? 1 : 0;
  const sweep = d1 > d0 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const MONO = "ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace";
const SANS = "system-ui,-apple-system,'Segoe UI',sans-serif";
const SERIF = "Georgia,'Times New Roman',serif";

/* =============================================================== readings = */
const METRICS = [
  { id: 'rate', name: 'Burn rate', label: 'BURN RATE', unit: '/hr',
    val: d => money(d.rate), raw: d => d.rate, frac: d => gf(d.rate),
    sub: () => '5 min average' },
  { id: 'today', name: 'Today', label: 'TODAY', unit: '',
    val: d => money(d.today), raw: d => d.today, frac: d => gf(d.today),
    sub: () => 'since midnight' },
  { id: 'session', name: 'Session', label: 'THIS SESSION', unit: '',
    val: d => money(d.live ? d.live.cost : 0), raw: d => d.live ? d.live.cost : 0,
    frac: d => gf(d.live ? d.live.cost : 0),
    sub: d => d.live ? esc(String(d.live.title).slice(0, 34)) : 'no live session' },
  { id: 'instances', name: 'Instances', label: 'RUNNING NOW', unit: '',
    val: d => String(d.instances || 0), raw: d => d.instances || 0,
    frac: d => Math.min(1, (d.instances || 0) / 6),
    sub: d => !d.instances ? 'no active sessions'
      : `${d.instancesHot || 0} mid-response · ${money(d.instanceRate || 0)}/hr combined` },
  { id: 'combined', name: 'All windows', label: 'ALL WINDOWS', unit: '/hr',
    val: d => money(d.instanceRate || 0), raw: d => d.instanceRate || 0,
    frac: d => gf(d.instanceRate || 0),
    sub: d => `${d.instances || 0} session${d.instances === 1 ? '' : 's'} · ${money(d.instanceCost || 0)} in 15 min` },
  { id: 'month', name: 'Month', label: 'THIS MONTH', unit: '',
    val: d => money(d.month), raw: d => d.month, frac: d => Math.min(1, d.multiple / 20),
    sub: d => d.multiple.toFixed(1) + 'x the plan fee' },
  { id: 'worth', name: "Money's worth", label: "MONEY'S WORTH", unit: 'x',
    val: d => d.multiple.toFixed(2), raw: d => d.multiple, frac: d => Math.min(1, d.multiple / 20),
    sub: d => money(d.month) + ' on a ' + money(d.fee) + ' plan' },
  { id: 'alltime', name: 'All time', label: 'ALL TIME', unit: '',
    val: d => money(d.allTime), raw: d => d.allTime, frac: d => Math.min(1, d.allTime / 20000),
    sub: () => 'total API value' },
  { id: 'tokens', name: 'Tokens/min', label: 'TOKENS / MIN', unit: '',
    val: d => toks(d.tokensLastMin), raw: d => d.tokensLastMin,
    frac: d => Math.min(1, d.tokensLastMin / 150000), sub: () => 'billable, last minute' },
  { id: 'fivehour', name: '5-hour limit', label: '5-HOUR LIMIT', unit: '%',
    val: d => limText(d, 'fiveHour'),
    raw: d => limPct(d, 'fiveHour') || 0, frac: d => (limPct(d, 'fiveHour') || 0) / 100,
    sub: d => d.fiveHourPct != null
      ? (d.blockResetsIn > 0 ? 'resets in ' + dur(d.blockResetsIn) : '5-hour allowance')
      : (lim(d, 'fiveHour') && lim(d, 'fiveHour').real
          ? 'calibrated estimate' : 'estimate: vs your busiest block') },
  { id: 'week', name: 'Weekly limit', label: 'WEEKLY LIMIT', unit: '%',
    val: d => limText(d, 'week'),
    raw: d => limPct(d, 'week') || 0, frac: d => (limPct(d, 'week') || 0) / 100,
    sub: d => d.weekPct != null ? '7-day allowance'
      : (lim(d, 'week') && lim(d, 'week').real
          ? 'calibrated estimate' : 'estimate: vs your busiest week') },
  { id: 'context', name: 'Context', label: 'CONTEXT WINDOW', unit: '%',
    val: d => d.contextPct == null ? '--' : String(Math.round(d.contextPct)),
    raw: d => d.contextPct || 0, frac: d => (d.contextPct || 0) / 100,
    sub: () => 'current session' }
];

/* The true 5-hour / weekly percentages only exist in a terminal session. When
   they are missing, fall back to the server's history-derived stand-in and mark
   it with a tilde so an estimate never reads as a hard number. */
function lim(d, which) {
  const real = which === 'week' ? d.weekPct : d.fiveHourPct;
  if (real != null) return { pct: real, real: true };
  const sl = d.self && d.self[which === 'week' ? 'week' : 'fiveHour'];
  return sl ? { pct: sl.pct, real: !!sl.real, ref: sl.ref } : null;
}
const limPct  = (d, w) => { const l = lim(d, w); return l ? l.pct : null; };
const limText = (d, w) => {
  const l = lim(d, w);
  if (!l) return '--';
  return (l.real ? '' : '~') + Math.round(l.pct);
};

let metric = 'rate';
let skin = 'dial';

function reading(d) {
  const M = METRICS.find(x => x.id === metric) || METRICS[0];
  const frac = Math.max(0, Math.min(1, M.frac(d) || 0));
  return { id: M.id, label: M.label, value: M.val(d), unit: M.unit,
           sub: M.sub(d), frac, n: M.raw(d) || 0, color: zone(frac) };
}

/* ================================================================= faces = */
/* Each renders the inner markup of a 320x160 SVG. `m` is the resolved
   reading; faces tied to one thing say so in their note. */
const SKINS = [];
const face = (id, name, note, render) => SKINS.push({ id, name, note, render });
const VB = 'viewBox="0 0 320 160" preserveAspectRatio="xMidYMid meet"';

/* -- 1. dial: the clean modern one -------------------------------------- */
face('dial', 'Dial', 'follows the reading', (d, m) => {
  const cx = 78, cy = 108, r = 60;
  const ticks = [0, .25, .5, .75, 1].map(f => {
    const [a, b] = polar(cx, cy, r - 11, 180 + f * 180);
    const [c, e] = polar(cx, cy, r - 17, 180 + f * 180);
    return `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="#55534d" stroke-width="1.6"/>`;
  }).join('');
  const [nx, ny] = polar(cx, cy, r - 16, 180 + m.frac * 180);
  const [tx, ty] = polar(cx, cy, 9, 360 + m.frac * 180);
  return `
    <rect width="320" height="160" fill="#111110" rx="10"/>
    <path d="${arcPath(cx, cy, r, 180, 360)}" fill="none" stroke="#2a2a27" stroke-width="13" stroke-linecap="round"/>
    <path d="${arcPath(cx, cy, r, 180, 180 + Math.max(.006, m.frac) * 180)}" fill="none"
          stroke="${m.color}" stroke-width="13" stroke-linecap="round"/>
    ${ticks}
    <line x1="${tx}" y1="${ty}" x2="${nx}" y2="${ny}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#242422" stroke="#3a3a37"/>
    <circle cx="${cx}" cy="${cy}" r="2.4" fill="${m.color}"/>
    <text x="152" y="64" font-family="${SANS}" font-size="11" letter-spacing="1.6" fill="#8b8983">${m.label}</text>
    <text x="152" y="105" font-family="${SANS}" font-size="37" font-weight="650" fill="#fff">${esc(m.value)}<tspan
          font-size="16" fill="#c9c8bd">${m.unit}</tspan></text>
    <text x="152" y="126" font-family="${SANS}" font-size="11.5" fill="#8b8983">${esc(m.sub)}</text>`;
});

/* -- 2. pump: the old-timey gas station one ----------------------------- */
face('pump', 'Gas pump', 'plus tokens and rate', (d, m) => {
  const win = (x, y, w, h, label, value, big) => `
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#fbf7ec" stroke="#8d6a3f" stroke-width="1.5"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="url(#glass)"/>
    <text x="${x + w / 2}" y="${y + h - 6}" text-anchor="middle" font-family="${SANS}" font-size="7"
          letter-spacing="1.3" fill="#9a7b52">${label}</text>
    <text x="${x + w / 2}" y="${y + (big ? 29 : 27)}" text-anchor="middle" font-family="${MONO}"
          font-size="${big ? 25 : 20}" font-weight="700" fill="#2b2118" letter-spacing="1">${value}</text>`;
  return `
    <defs>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
        <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#c9b48f" stop-opacity=".3"/></linearGradient>
      <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f5ecd8"/><stop offset="1" stop-color="#e2d3b2"/></linearGradient>
    </defs>
    <rect width="320" height="160" fill="#1b1a17" rx="10"/>
    <rect x="7" y="6" width="306" height="148" rx="9" fill="url(#enamel)" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M10.5 30 h299 v-15 a9 9 0 0 0 -9 -9 h-281 a9 9 0 0 0 -9 9 z" fill="#c0392b"/>
    <rect x="10.5" y="26" width="299" height="8" fill="#c0392b"/>
    <text x="160" y="27" text-anchor="middle" font-family="${SERIF}" font-size="15"
          font-weight="700" letter-spacing="3" fill="#f7ecd5">BURNMETER</text>
    <circle cx="30" cy="20" r="7" fill="#f7ecd5"/><circle cx="30" cy="20" r="4.2" fill="#c0392b"/>
    <circle cx="290" cy="20" r="7" fill="#f7ecd5"/><circle cx="290" cy="20" r="4.2" fill="#c0392b"/>
    ${win(16, 44, 152, 46, esc(m.label), esc(m.value) + m.unit, true)}
    ${win(176, 44, 128, 46, 'TOKENS PER MIN', toks(d.tokensLastMin))}
    <rect x="16" y="98" width="288" height="44" rx="4" fill="#2b2118"/>
    <text x="28" y="115" font-family="${SANS}" font-size="7.5" letter-spacing="1.5" fill="#c9a765">PRICE PER HOUR</text>
    <text x="28" y="134" font-family="${MONO}" font-size="19" font-weight="700" fill="#f2c14e">$${plain(d.rate)}</text>
    <text x="292" y="115" text-anchor="end" font-family="${SANS}" font-size="7.5" letter-spacing="1.5" fill="#c9a765">TODAY</text>
    <text x="292" y="134" text-anchor="end" font-family="${MONO}" font-size="19" font-weight="700" fill="#f2c14e">${money(d.today, 1)}</text>`;
});

/* -- 3. tach: car rev counter with a redline ---------------------------- */
face('tach', 'Tachometer', 'follows the reading', (d, m) => {
  const cx = 160, cy = 95, r = 58, D0 = 150, D1 = 390;
  const at = f => D0 + f * (D1 - D0);
  const scale = m.id === 'rate' ? [0, 1, 5, 10, 25, 50, 100, 300].map(v => [gf(v), v])
                                : [0, .25, .5, .75, 1].map(f => [f, Math.round(f * 100)]);
  const marks = scale.map(([f, t]) => {
    const [x, y] = polar(cx, cy, r - 18, at(f));
    const [a, b] = polar(cx, cy, r - 5, at(f)), [c, e] = polar(cx, cy, r - 11, at(f));
    return `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="#d8d5cc" stroke-width="1.9"/>
            <text x="${x}" y="${y + 3.4}" text-anchor="middle" font-family="${SANS}" font-size="9"
                  font-weight="600" fill="#d8d5cc">${t}</text>`;
  }).join('');
  const [nx, ny] = polar(cx, cy, r - 15, at(m.frac));
  const [bx, by] = polar(cx, cy, 11, at(m.frac) + 180);
  return `
    <rect width="320" height="160" fill="#0a0a09" rx="10"/>
    <circle cx="${cx}" cy="${cy}" r="${r + 7}" fill="#141412" stroke="#26251f" stroke-width="2"/>
    <path d="${arcPath(cx, cy, r, D0, D1)}" fill="none" stroke="#2e2d28" stroke-width="7"/>
    <path d="${arcPath(cx, cy, r, at(.78), D1)}" fill="none" stroke="#c62828" stroke-width="7"/>
    <path d="${arcPath(cx, cy, r, D0, at(Math.max(.006, m.frac)))}" fill="none" stroke="${m.color}" stroke-width="7"/>
    ${marks}
    <text x="${cx}" y="20" text-anchor="middle" font-family="${SANS}" font-size="9"
          letter-spacing="2.4" fill="#8b8983">${m.label}</text>
    <text x="${cx}" y="${cy + 34}" text-anchor="middle" font-family="${MONO}" font-size="15"
          font-weight="700" fill="#fff">${esc(m.value)}${m.unit}</text>
    <line x1="${bx}" y1="${by}" x2="${nx}" y2="${ny}" stroke="#e8443a" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="#26251f" stroke="#3a3a34"/>`;
});

/* -- 4. rings: all three limits at once --------------------------------- */
face('rings', 'Rings', 'the three limits', (d) => {
  const cx = 80, cy = 80, D0 = -90, SW = 300;
  const ring = (r, pct, col) => {
    const f = Math.max(0, Math.min(1, (pct || 0) / 100));
    return `<path d="${arcPath(cx, cy, r, D0, D0 + SW)}" fill="none" stroke="#26251f" stroke-width="11" stroke-linecap="round"/>
      ${f > .006 ? `<path d="${arcPath(cx, cy, r, D0, D0 + SW * f)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>` : ''}`;
  };
  const row = (y, name, pct, col, note) => `
    <circle cx="176" cy="${y - 4}" r="4" fill="${col}"/>
    <text x="188" y="${y}" font-family="${SANS}" font-size="11.5" fill="#c9c8bd">${name}</text>
    <text x="306" y="${y}" text-anchor="end" font-family="${MONO}" font-size="13" font-weight="700"
          fill="#fff">${pct == null ? '--' : Math.round(pct) + '%'}</text>
    <text x="188" y="${y + 12}" font-family="${SANS}" font-size="9" fill="#6f6d66">${note}</text>`;
  return `
    <rect width="320" height="160" fill="#111110" rx="10"/>
    ${ring(62, limPct(d, 'week'), '#4a94ee')}
    ${ring(47, limPct(d, 'fiveHour'), '#e0a516')}
    ${ring(32, d.contextPct, '#a274e8')}
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-family="${SANS}" font-size="15"
          font-weight="650" fill="#fff">${d.multiple.toFixed(1)}x</text>
    ${row(46, 'Weekly', limPct(d, 'week'), '#4a94ee',
        d.weekPct != null ? '7-day allowance' : 'estimate vs your own')}
    ${row(86, '5-hour', limPct(d, 'fiveHour'), '#e0a516',
        d.fiveHourPct != null
          ? (d.blockResetsIn > 0 ? 'resets in ' + dur(d.blockResetsIn) : '5-hour allowance')
          : 'estimate vs your own')}
    ${row(126, 'Context', d.contextPct, '#a274e8',
        d.contextPct != null ? 'this session' : 'terminal sessions only')}`;
});

/* -- 5. flap: airport split-flap board ---------------------------------- */
face('flap', 'Split-flap', 'follows the reading', (d, m) => {
  const chars = (m.value + m.unit).split('');
  const w = Math.min(30, 284 / Math.max(6, chars.length));
  const total = chars.length * (w + 2);
  const x0 = 160 - total / 2;
  const tiles = chars.map((c, i) => {
    const x = x0 + i * (w + 2);
    return `<g>
      <rect x="${x}" y="58" width="${w}" height="52" rx="3" fill="#151513" stroke="#2e2d28"/>
      <rect x="${x}" y="58" width="${w}" height="26" rx="3" fill="#1e1e1b"/>
      <line x1="${x}" y1="84" x2="${x + w}" y2="84" stroke="#000" stroke-width="1.4"/>
      <text x="${x + w / 2}" y="93" text-anchor="middle" font-family="${MONO}" font-size="29"
            font-weight="700" fill="#f0ede4">${esc(c)}</text></g>`;
  }).join('');
  return `
    <rect width="320" height="160" fill="#0b0b0a" rx="10"/>
    <rect x="8" y="8" width="304" height="144" rx="7" fill="#131311" stroke="#26251f"/>
    <text x="20" y="34" font-family="${SANS}" font-size="10" letter-spacing="2.4" fill="#d8b56a">${m.label}</text>
    <text x="300" y="34" text-anchor="end" font-family="${SANS}" font-size="10" fill="#6f6d66">${esc(d.planName)}</text>
    <line x1="20" y1="42" x2="300" y2="42" stroke="#26251f"/>
    ${tiles}
    <text x="160" y="134" text-anchor="middle" font-family="${SANS}" font-size="10" fill="#8b8983">${esc(m.sub)}</text>`;
});

/* -- 6. nixie: glowing valve tubes -------------------------------------- */
face('nixie', 'Nixie tubes', 'follows the reading', (d, m) => {
  const chars = (m.value + m.unit).split('');
  const w = Math.min(34, 282 / Math.max(5, chars.length));
  const x0 = 160 - (chars.length * w) / 2;
  const tubes = chars.map((c, i) => {
    const x = x0 + i * w + w / 2;
    return `<g>
      <rect x="${x - w / 2 + 2}" y="46" width="${w - 4}" height="66" rx="${Math.max(3, (w - 4) / 2)}"
            fill="#0f1512" stroke="#2b3a33" stroke-width="1.2"/>
      <ellipse cx="${x}" cy="46" rx="${(w - 4) / 2}" ry="5" fill="#16201b" stroke="#2b3a33"/>
      <text x="${x}" y="90" text-anchor="middle" font-family="${MONO}" font-size="29" font-weight="600"
            fill="#ffa63d" filter="url(#glow)">${esc(c)}</text>
      <rect x="${x - w / 2 + 5}" y="112" width="${Math.max(4, w - 10)}" height="7" fill="#3a3a34"/></g>`;
  }).join('');
  return `
    <defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    <rect width="320" height="160" fill="#070a09" rx="10"/>
    <rect x="8" y="8" width="304" height="144" rx="8" fill="#0c110f" stroke="#1e2a24"/>
    <text x="160" y="30" text-anchor="middle" font-family="${SANS}" font-size="9.5" letter-spacing="3"
          fill="#5d7a6b">${m.label}</text>
    ${tubes}
    <rect x="24" y="120" width="272" height="4" rx="2" fill="#161d19"/>
    <text x="160" y="142" text-anchor="middle" font-family="${SANS}" font-size="9.5" fill="#4e6659">${esc(m.sub)}</text>`;
});

/* -- 7. vu: analog audio meter ------------------------------------------ */
face('vu', 'VU meter', 'follows the reading', (d, m) => {
  // Pivot sits low so the scale sweeps the top half and the readout has the
  // bottom of the face to itself - same trick a real VU meter uses.
  const cx = 160, cy = 150, r = 98, D0 = 213, D1 = 327;
  const at = f => D0 + f * (D1 - D0);
  const marks = [0, .15, .3, .45, .6, .72, .86, 1].map(f => {
    const [a, b] = polar(cx, cy, r, at(f)), [c, e] = polar(cx, cy, r - 8, at(f));
    const hot = f >= .72;
    return `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="${hot ? '#b3261e' : '#2b2620'}"
            stroke-width="${hot ? 2.2 : 1.5}"/>`;
  }).join('');
  const nums = [[0, '0'], [.3, '20'], [.6, '60'], [.86, '100'], [1, '300']].map(([f, t]) => {
    const [x, y] = polar(cx, cy, r - 17, at(f));
    return `<text x="${x}" y="${y + 3}" text-anchor="middle" font-family="${SERIF}" font-size="9"
            fill="${f >= .72 ? '#b3261e' : '#3d362c'}">${t}</text>`;
  }).join('');
  const [nx, ny] = polar(cx, cy, r - 3, at(m.frac));
  return `
    <rect width="320" height="160" fill="#14120e" rx="10"/>
    <rect x="8" y="8" width="304" height="144" rx="6" fill="#e8dcbe"/>
    <path d="${arcPath(cx, cy, r, D0, D1)}" fill="none" stroke="#2b2620" stroke-width="1.4"/>
    <path d="${arcPath(cx, cy, r, at(.72), D1)}" fill="none" stroke="#b3261e" stroke-width="2.6"/>
    ${marks}${nums}
    <text x="160" y="32" text-anchor="middle" font-family="${SERIF}" font-size="10"
          letter-spacing="2.6" fill="#5a4f3d">${m.label}</text>
    <text x="24" y="140" font-family="${SERIF}" font-size="20"
          font-weight="700" fill="#2b2620">${esc(m.value)}${m.unit}</text>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#1a1712" stroke-width="1.7"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#c9bda0" stroke="#8a7d63"/>
    <circle cx="288" cy="30" r="5.5" fill="${m.frac >= .72 ? '#e03b2f' : '#7d6f58'}" stroke="#5a4f3d"/>
    <text x="288" y="45" text-anchor="middle" font-family="${SANS}" font-size="7" fill="#5a4f3d">PEAK</text>
    <text x="296" y="140" text-anchor="end" font-family="${SANS}" font-size="8.5" fill="#5a4f3d">${esc(m.sub)}</text>`;
});

/* -- 8. bars: spectrum-analyser burn history ---------------------------- */
face('bars', 'Equalizer', 'last 40 minutes', (d, m) => {
  const sp = (d.spark && d.spark.length) ? d.spark : new Array(20).fill(0);
  const max = Math.max(0.0001, ...sp);
  const n = sp.length, bw = 288 / n;
  const bars = sp.map((v, i) => {
    const f = v / max;
    // Square root, not linear: burn is bursty, and a linear scale flattens
    // every quiet bucket into the same 2px stub.
    const h = Math.max(2, Math.sqrt(f) * 76);
    const x = 16 + i * bw;
    return `<rect x="${x + 1}" y="${116 - h}" width="${bw - 2}" height="${h}" rx="1.5"
             fill="${zone(f)}" opacity="${i === n - 1 ? 1 : .8}"/>
            <rect x="${x + 1}" y="${113 - h}" width="${bw - 2}" height="2.5" rx="1" fill="#fff" opacity=".5"/>`;
  }).join('');
  const grid = [0, .25, .5, .75, 1].map(f =>
    `<line x1="16" y1="${116 - f * 76}" x2="304" y2="${116 - f * 76}" stroke="#22221f"/>`).join('');
  return `
    <rect width="320" height="160" fill="#0c0c0b" rx="10"/>
    <text x="16" y="26" font-family="${SANS}" font-size="10" letter-spacing="2" fill="#8b8983">${m.label}</text>
    <text x="304" y="26" text-anchor="end" font-family="${MONO}" font-size="17" font-weight="700"
          fill="${m.color}">${esc(m.value)}${m.unit}</text>
    ${grid}${bars}
    <line x1="16" y1="116" x2="304" y2="116" stroke="#3a3a34"/>
    <text x="16" y="134" font-family="${SANS}" font-size="9" fill="#55534d">40 min ago</text>
    <text x="304" y="134" text-anchor="end" font-family="${SANS}" font-size="9" fill="#55534d">now</text>
    <text x="160" y="151" text-anchor="middle" font-family="${SANS}" font-size="9" fill="#6f6d66">${esc(m.sub)}</text>`;
});

/* -- 9. thermo: mercury thermometer ------------------------------------- */
face('thermo', 'Thermometer', 'follows the reading', (d, m) => {
  const x = 52, top = 24, bot = 104, h = bot - top;
  const fill = h * m.frac;
  const ticks = [0, .25, .5, .75, 1].map(f => `
    <line x1="${x + 13}" y1="${bot - f * h}" x2="${x + 21}" y2="${bot - f * h}" stroke="#55534d" stroke-width="1.4"/>
    <text x="${x + 26}" y="${bot - f * h + 3.5}" font-family="${SANS}" font-size="8.5"
          fill="#8b8983">${Math.round(f * 100)}</text>`).join('');
  return `
    <rect width="320" height="160" fill="#111110" rx="10"/>
    <rect x="${x - 9}" y="${top - 8}" width="18" height="${h + 18}" rx="9" fill="#1d1d1a" stroke="#33322c"/>
    <circle cx="${x}" cy="${bot + 24}" r="16" fill="#1d1d1a" stroke="#33322c"/>
    <rect x="${x - 5}" y="${bot - fill}" width="10" height="${fill + 26}" rx="5" fill="${m.color}"/>
    <circle cx="${x}" cy="${bot + 24}" r="11" fill="${m.color}"/>
    ${ticks}
    <text x="122" y="50" font-family="${SANS}" font-size="10.5" letter-spacing="1.8" fill="#8b8983">${m.label}</text>
    <text x="122" y="90" font-family="${SANS}" font-size="35" font-weight="650" fill="#fff">${esc(m.value)}<tspan
          font-size="16" fill="#c9c8bd">${m.unit}</tspan></text>
    <text x="122" y="112" font-family="${SANS}" font-size="10.5" fill="#8b8983">${esc(m.sub)}</text>
    <text x="122" y="136" font-family="${MONO}" font-size="10" fill="#6f6d66">today ${money(d.today)} · ${d.multiple.toFixed(1)}x plan</text>`;
});

/* -- 10. term: it is a terminal ----------------------------------------- */
face('term', 'Terminal', 'everything at once', (d) => {
  const spark = (d.spark || []).slice(-16);
  const mx = Math.max(0.0001, ...spark);
  const blocks = '▁▂▃▄▅▆▇█';
  const sp = spark.map(v => blocks[Math.min(7, Math.floor((v / mx) * 7.99))]).join('');
  const bar = p => {
    const f = Math.max(0, Math.min(1, (p || 0) / 100));
    const k = Math.round(f * 12);
    return '[' + '█'.repeat(k) + '·'.repeat(12 - k) + ']';
  };
  const line = (y, a, b, col) => `
    <text x="18" y="${y}" font-family="${MONO}" font-size="11" fill="#4e7a52">${a}</text>
    <text x="86" y="${y}" font-family="${MONO}" font-size="11" fill="${col || '#7dd88a'}">${esc(b)}</text>`;
  return `
    <rect width="320" height="160" fill="#060906" rx="10"/>
    <rect x="6" y="6" width="308" height="148" rx="7" fill="#080d08" stroke="#17301a"/>
    <text x="18" y="26" font-family="${MONO}" font-size="11" fill="#3f6343">$ burnmeter --watch</text>
    ${line(46, 'RATE', '$' + plain(d.rate) + '/hr ' + sp, zone(gf(d.rate)))}
    ${line(64, 'TODAY', money(d.today))}
    ${line(82, 'MONTH', money(d.month) + '  ' + d.multiple.toFixed(2) + 'x')}
    ${line(100, '5H', bar(limPct(d, 'fiveHour')) + ' ' + limText(d, 'fiveHour') + '%',
           zone((limPct(d, 'fiveHour') || 0) / 100))}
    ${line(118, 'WEEK', bar(limPct(d, 'week')) + ' ' + limText(d, 'week') + '%',
           zone((limPct(d, 'week') || 0) / 100))}
    ${line(136, 'WINDOWS', (d.instances || 0) + ' active' +
        (d.instances ? '  ' + money(d.instanceRate || 0) + '/hr' : '') +
        '   tok/m ' + toks(d.tokensLastMin))}
    <rect x="150" y="128" width="7" height="10" fill="#7dd88a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>`;
});

/* -- 11. odo: mechanical odometer --------------------------------------- */
face('odo', 'Odometer', 'lifetime total', (d) => {
  const whole = Math.floor(d.allTime).toString().padStart(5, '0').slice(-5);
  const frac = (d.allTime % 1).toFixed(2).slice(2);
  const cells = (whole + '.' + frac).split('');
  const widths = cells.map(c => c === '.' ? 12 : 28);
  const total = widths.reduce((a, b) => a + b, 0);
  let cur = 160 - total / 2;
  const left = cur;
  const drums = cells.map((c, i) => {
    const x = cur, w = widths[i];
    cur += w;
    if (c === '.') return `<circle cx="${x + 6}" cy="92" r="3" fill="#e8e4d8"/>`;
    const tenth = i >= cells.length - 2;
    return `<g>
      <rect x="${x + 1}" y="62" width="${w - 2}" height="46" rx="2.5" fill="${tenth ? '#5c1f1a' : '#101010'}" stroke="#3a3a34"/>
      <rect x="${x + 1}" y="62" width="${w - 2}" height="46" rx="2.5" fill="url(#drum)"/>
      <text x="${x + w / 2}" y="96" text-anchor="middle" font-family="${MONO}" font-size="26"
            font-weight="700" fill="#f0ede4">${esc(c)}</text></g>`;
  }).join('');
  return `
    <defs><linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient></defs>
    <rect width="320" height="160" fill="#161513" rx="10"/>
    <rect x="8" y="8" width="304" height="144" rx="8" fill="#1e1d1a" stroke="#33322c"/>
    <text x="160" y="44" text-anchor="middle" font-family="${SANS}" font-size="9.5" letter-spacing="3"
          fill="#8b8983">TOTAL API VALUE</text>
    <rect x="${left - 6}" y="58" width="${total + 12}" height="54" rx="4" fill="#0a0a09" stroke="#42413a"/>
    ${drums}
    <text x="26" y="132" font-family="${SANS}" font-size="8.5" letter-spacing="1.2" fill="#6f6d66">TRIP TODAY</text>
    <text x="26" y="146" font-family="${MONO}" font-size="13" font-weight="700" fill="#d8b56a">${money(d.today)}</text>
    <text x="294" y="132" text-anchor="end" font-family="${SANS}" font-size="8.5" letter-spacing="1.2" fill="#6f6d66">THIS MONTH</text>
    <text x="294" y="146" text-anchor="end" font-family="${MONO}" font-size="13" font-weight="700"
          fill="#d8b56a">${d.multiple.toFixed(1)}x</text>`;
});

/* ================================================================ render = */
let LAST = null, pinned = false;
function render(d) {
  if (!d) return;
  LAST = d;
  const m = reading(d);
  const S = SKINS.find(x => x.id === skin) || SKINS[0];
  let body;
  try { body = S.render(d, m); }
  catch (err) { body = `<rect width="320" height="160" fill="#111"/><text x="160" y="84"
    text-anchor="middle" font-family="${SANS}" font-size="12" fill="#e04a4a">face failed: ${esc(S.name)}</text>`; }
  $('#stage').innerHTML = `<svg ${VB} xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  $('#stage').title = `${S.name} - ${m.label}\nClick to change the reading, the circle button for the face.`;
  $('#stale').classList.toggle('on', !!d.stale && d.fiveHourPct != null);
  if (typeof d.onTop === 'boolean' && d.onTop !== pinned) {
    pinned = d.onTop;
    $('#bPin').setAttribute('aria-pressed', String(pinned));
  }
}

/* ================================================================ picker = */
function buildPicker() {
  $('#pSkins').innerHTML = SKINS.map(s =>
    `<button data-skin="${s.id}" title="${esc(s.note)}" aria-pressed="${s.id === skin}">${esc(s.name)}</button>`).join('');
  $('#pMetrics').innerHTML = METRICS.map(x =>
    `<button data-metric="${x.id}" aria-pressed="${x.id === metric}">${esc(x.name)}</button>`).join('');
}
$('#pSkins').onclick = e => {
  const b = e.target.closest('[data-skin]'); if (b) setSkin(b.dataset.skin);
};
$('#pMetrics').onclick = e => {
  const b = e.target.closest('[data-metric]'); if (b) setMetric(b.dataset.metric);
};
function setSkin(id)   { skin = id;   save({ miniSkin: id });   buildPicker(); render(LAST); }
function setMetric(id) { metric = id; save({ miniMetric: id }); buildPicker(); render(LAST); }
function cycleSkin(step) {
  const i = SKINS.findIndex(s => s.id === skin);
  setSkin(SKINS[(i + step + SKINS.length) % SKINS.length].id);
}
function cycleMetric() {
  const i = METRICS.findIndex(x => x.id === metric);
  setMetric(METRICS[(i + 1) % METRICS.length].id);
}
$('#bSkin').onclick  = () => { buildPicker(); $('#pick').classList.toggle('open'); };
$('#pClose').onclick = () => $('#pick').classList.remove('open');
$('#stage').onclick  = cycleMetric;     // fastest control there is
addEventListener('keydown', e => {
  if (e.key === ']') cycleSkin(1);
  else if (e.key === '[') cycleSkin(-1);
  else if (e.key === 'm') cycleMetric();
  else if (e.key === 'Escape') $('#pick').classList.remove('open');
});

/* ================================================================ window = */
const STEPS = [[240, 160], [300, 190], [380, 230], [470, 275], [580, 330]];
let sizeIdx = null;
function nearestStep() {
  let best = 0, bd = Infinity;
  STEPS.forEach(([w], i) => { const dd = Math.abs(w - window.outerWidth); if (dd < bd) { bd = dd; best = i; } });
  return best;
}
function resizeStep(delta) {
  const base = sizeIdx == null ? nearestStep() : sizeIdx;
  const i = Math.min(STEPS.length - 1, Math.max(0, base + delta));
  sizeIdx = i;
  const [w, h] = STEPS[i];
  try { window.resizeTo(w, h); } catch {}
  // Chromium refuses resizeTo in some window types. Check whether it took, and
  // if not, have the server resize the real OS window instead.
  setTimeout(() => {
    if (Math.abs(window.outerWidth - w) > 24) {
      fetch('/api/window', { method: 'POST', headers: { 'content-type': 'application/json' },
                             body: JSON.stringify({ action: 'size', width: w, height: h }) }).catch(() => {});
    } else save({ miniScale: w / 380 });
  }, 170);
}
$('#bUp').onclick   = () => resizeStep(1);
$('#bDown').onclick = () => resizeStep(-1);

const CORNERS = ['BR', 'BL', 'TL', 'TR'];
let cornerIdx = -1;
$('#bSnap').onclick = () => {
  cornerIdx = (cornerIdx + 1) % CORNERS.length;
  fetch('/api/window', { method: 'POST', headers: { 'content-type': 'application/json' },
                         body: JSON.stringify({ action: 'corner', corner: CORNERS[cornerIdx] }) }).catch(() => {});
};

$('#bOpen').onclick = () => {
  fetch('/api/open', { method: 'POST', headers: { 'content-type': 'application/json' },
                       body: JSON.stringify({ which: 'main' }) }).catch(() => window.open('/', '_blank'));
};

async function setPin(on) {
  const btn = $('#bPin');
  const r = await fetch('/api/ontop', { method: 'POST', headers: { 'content-type': 'application/json' },
                                        body: JSON.stringify({ on }) })
    .then(r => r.json()).catch(() => ({ ok: false }));
  if (r.ok) {
    pinned = on;
    btn.setAttribute('aria-pressed', String(on));
    btn.title = on ? 'Pinned on top - click to release' : 'Keep this window on top of everything';
  } else {
    btn.title = 'Always-on-top needs the Windows helper (desktop/window.ps1)';
  }
}
$('#bPin').onclick = () => setPin(!pinned);

/* ================================================================== wire = */
function save(patch) {
  fetch('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' },
                         body: JSON.stringify(patch) }).catch(() => {});
}

let es, gotPrefs = false;
function connect() {
  es = new EventSource('/api/stream?mini=1');
  es.onmessage = ev => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (!gotPrefs) {                       // adopt saved preferences on first frame
      gotPrefs = true;
      if (d.skin && SKINS.some(s => s.id === d.skin)) skin = d.skin;
      if (d.metric && METRICS.some(x => x.id === d.metric)) metric = d.metric;
      buildPicker();
    }
    render(d);
  };
  es.onerror = () => { es.close(); $('#stale').classList.add('on'); setTimeout(connect, 2500); };
}
buildPicker();
connect();

document.body.addEventListener('dblclick', e => { if (!e.target.closest('#ctl,#pick')) $('#bOpen').click(); });
</script>
</body>
